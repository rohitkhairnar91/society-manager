<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Society Manager</title>
<meta name="theme-color" content="#0f5c4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d2421; --muted:#6b736f; --line:#e6e1d6;
  --pri:#0f5c4d; --pri-2:#13745f; --pri-soft:#e3f0ec;
  --amber:#b7791f; --amber-soft:#fbf1de; --red:#b4412f; --red-soft:#f9e5e1;
  --blue:#2f5fa7; --blue-soft:#e4ecf8; --grey-soft:#eeece6;
  --r:16px; --shadow:0 1px 2px rgba(20,30,25,.05),0 4px 14px rgba(20,30,25,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans Devanagari",system-ui,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--sb))}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(14px + var(--st)) 18px 16px;display:flex;align-items:center;gap:12px}
header.top .t{flex:1;min-width:0}
header.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.iconbtn svg{width:20px;height:20px}
main{padding:16px}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:#7a5212;font-size:13px}
.banner:empty{display:none}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
h2.sec a,h2.sec button{color:var(--pri);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .n{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);font-weight:500}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri-2));color:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero .l{font-size:12.5px;opacity:.85}
.hero .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.22);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:#fff;border-radius:8px}
.hero .row{display:flex;justify-content:space-between;font-size:12.5px;opacity:.92}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.item .av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--pri-soft);color:var(--pri);flex:none}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-green{background:var(--pri-soft);color:var(--pri)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-grey{background:var(--grey-soft);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;outline:none}
.search:focus{border-color:var(--pri)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--pri);color:#fff;font-size:14px}
.btn.sec{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:var(--grey-soft);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + var(--sb));width:56px;height:56px;border-radius:18px;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,92,77,.35);z-index:6}
.fab svg{width:26px;height:26px}
.fab[hidden],[hidden]{display:none!important}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:7;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pri)}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.monthbar .m{font-weight:800;font-size:16px}
.monthbar button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--grey-soft)}
.act{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;gap:12px;width:100%;text-align:left}
.act .date{width:50px;flex:none;text-align:center;border-radius:12px;background:var(--blue-soft);color:var(--blue);padding:6px 0}
.act .date .d{font-size:20px;font-weight:800;line-height:1}
.act .date .mo{font-size:11px;font-weight:700;text-transform:uppercase}
.act .mid{flex:1;min-width:0}
.act .t1{font-weight:700}
.act .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
.act .desc{font-size:13px;margin-top:6px;color:#3b4440;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,18,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 16px calc(20px + var(--sb))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:#d3cdbf;margin:4px auto 10px}
.sheet h3{margin:4px 0 14px;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri)}
.f textarea{min-height:80px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--grey-soft);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:600;text-align:right;word-break:break-word}
.kv a{color:var(--pri)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months div{text-align:center;padding:7px 0;border-radius:10px;font-size:11px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.pill-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mt{margin-top:12px}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th,.rt td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rt th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#faf8f3}
.rt .r{text-align:right}.rt tr[data-stmt]{cursor:pointer}.rt .tot td{font-weight:800;background:#faf8f3}
.printhead{display:none}
.iconbtn{position:relative}.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5533d;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
nav.tabs .in{grid-template-columns:repeat(5,1fr)!important}
@media print{header.top,nav.tabs,.fab,.banner,.noprint,.toast,.sheet,.scrim{display:none!important}.app{padding:0}.printhead{display:block}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="t"><h1 id="hName">Society Manager</h1><div class="sub" id="hSub">Loading…</div></div>
    <button class="iconbtn" data-a="lang" id="langBtn" aria-label="Language" style="width:auto;padding:0 10px;font-weight:800;font-size:13px">मराठी</button>
    <button class="iconbtn" data-go="notices" id="bell" aria-label="Notices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="dot" id="annBadge" hidden>0</span></button>
    <button class="iconbtn" data-a="settings" id="gear" aria-label="Society settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="banner" id="banner"></div>
  <main id="main"><div class="loading">Loading society data…</div></main>
</div>
<button class="fab" id="fab" hidden aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="flats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>Flats</button>
  <button data-tab="dues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10M7 8h10M7 4c4 0 6 2 6 4s-2 4-6 4l7 8"/></svg>Dues</button>
  <button data-tab="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4M12 14h.01"/></svg>Complaints</button>
  <button data-tab="activities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Events</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import CFG from "./firebase-config.js";
(function(){
"use strict";
/* ---------- state ---------- */
const DEF_SETTINGS={name:"",address:"",amount:0,dueDay:10,upi:""};
const S={settings:{...DEF_SETTINGS},flats:[],dues:{},acts:[],anns:[],mtgs:[]};
const got={settings:false,flats:false,dues:false,acts:false};
let db=null, mode="connecting"; // connecting | signin | db | local
let canWrite=null; // true | false | null (unknown)
const VIEWS=["home","flats","dues","help","activities","notices","reports","minutes"];
let tab=(VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"home");
let month=curMonth(), flatFilter="all", flatQ="", duesFilter="pending", actSeg="ongoing";
const $=s=>document.querySelector(s);
/* ---------- language (English / मराठी) ---------- */
let LANG=(()=>{try{const v=localStorage.getItem("lang");if(v)return JSON.parse(v)}catch(e){}return /^mr/i.test(navigator.language||"")?"mr":"en"})();
function LOC(){return LANG==="mr"?"mr-IN-u-nu-latn":"en-IN"}

function tr(s){
  if(LANG!=="mr"||s==null)return s;
  const k=String(s).trim();if(!k)return s;
  if(Object.prototype.hasOwnProperty.call(MR,k))return String(s).replace(k,MR[k]);
  for(const [rx,rep] of MR_RX){if(rx.test(k))return String(s).replace(k,k.replace(rx,(...a)=>typeof rep==="function"?rep(...a):rep.replace(/\$(\d)/g,(_,i)=>trPart(a[+i]))))}
  if(k.includes(" · ")){const v=k.split(" · ").map(x=>tr(x)).join(" · ");if(v!==k)return String(s).replace(k,v)}
  const em=k.match(/^([^A-Za-z0-9₹\s]+)\s+(.+)$/);if(em){const v=tr(em[2]);if(v!==em[2])return String(s).replace(k,em[1]+" "+v)}
  return s;
}
function trPart(v){if(v==null)return "";const k=String(v).trim();return Object.prototype.hasOwnProperty.call(MR,k)?MR[k]:v}
const TR_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1};
function trTree(n){
  if(LANG!=="mr")return;
  if(n.nodeType===3){const p=n.parentNode;if(!p||TR_SKIP[p.nodeName]||(p.closest&&p.closest("[data-raw]")))return;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.nodeName==="SCRIPT"||n.nodeName==="STYLE"||n.hasAttribute("data-raw"))return;
  if(n.nodeName==="OPTION"&&!n.hasAttribute("value"))n.setAttribute("value",n.textContent);
  for(const a of ["placeholder","aria-label","title"]){if(n.hasAttribute(a)){const v=tr(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}}
  if(n.nodeName==="TEXTAREA")return;
  for(const c of n.childNodes)trTree(c);
}
new MutationObserver(ms=>{if(LANG!=="mr")return;for(const m of ms)for(const n of m.addedNodes)trTree(n)}).observe(document.body,{childList:true,subtree:true});

async function connect(){
  window.addEventListener("offline",()=>setBanner("You're offline — changes will sync when you reconnect."));
  window.addEventListener("online",()=>setBanner(""));
  if(DEMO){goLocal();return}
  try{
    const V="https://www.gstatic.com/firebasejs/10.12.2/";
    const [appM,fsM,auM]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-firestore.js"),import(V+"firebase-auth.js")]);
    F={...fsM,...auM};
    const app=appM.initializeApp(CFG);
    try{db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})})}
    catch(e){db=fsM.getFirestore(app)}
    auth=auM.getAuth(app);
    auM.getRedirectResult(auth).catch(e=>toast("Sign-in failed: "+(e.code||e.message)));
    auM.onAuthStateChanged(auth,u=>{
      stopAll();me=u;
      if(!u){mode="signin";canWrite=false;S.flats=[];S.dues={};S.acts=[];S.settings={...DEF_SETTINGS};render();return}
      mode="db";subscribe();render();
    });
  }catch(e){setBanner("Couldn't load Firebase. Check your internet connection and reopen the app.");mode="signin";render()}
}

let rpt={period:"fy"};
function fyStart(m){const [y,mo]=m.split("-").map(Number);return (mo>=4?y:y-1)+"-04"}
function monthsBetween(a,b){const out=[];let m=a;let g=0;while(m<=b&&g++<240){out.push(m);m=shiftMonth(m,1)}return out}
function rptRange(){
  const cm=curMonth();
  if(rpt.period==="fy")return [fyStart(cm),cm];
  if(rpt.period==="lastfy"){const s=shiftMonth(fyStart(cm),-12);return [s,shiftMonth(s,11)]}
  if(rpt.period==="month")return [month,month];
  const f=rpt.from||fyStart(cm),t=rpt.to||cm;return f<=t?[f,t]:[t,f];
}
function flatReport(f,ms){
  let due=0,paid=0,mDue=0,mPaid=0;const rows=[];
  ms.forEach(m=>{if(!applies(f,m)){rows.push({m,na:true});return}
    const a=flatAmount(f),r=payRec(m,f.id);mDue++;due+=a;
    if(r&&r.paid){const p=num(r.amount)||a;paid+=p;mPaid++;rows.push({m,due:a,paid:p,r})}else rows.push({m,due:a,paid:0});
  });
  return {due,paid,bal:due-paid,mDue,mPaid,rows};
}
function vReports(){
  const [from,to]=rptRange();const ms=monthsBetween(from,to);
  const flats=sortFlats(S.flats);const R=flats.map(f=>({f,...flatReport(f,ms)}));
  const T=R.reduce((t,x)=>({due:t.due+x.due,paid:t.paid+x.paid}),{due:0,paid:0});
  const defaulters=R.filter(x=>x.bal>0).length;
  return `<div class="noprint"><h2 class="sec" style="margin-top:4px">📊 Maintenance report</h2>
  <div class="chips">${[["fy","This financial year"],["lastfy","Last financial year"],["custom","Custom"]].map(([k,l])=>`<button class="chip ${rpt.period===k?"on":""}" data-rp="${k}">${l}</button>`).join("")}</div>
  ${rpt.period==="custom"?`<div class="frow mt"><div class="f"><label>From</label><input type="month" id="rpFrom" value="${esc(from)}"></div><div class="f"><label>To</label><input type="month" id="rpTo" value="${esc(to)}"></div></div>`:""}</div>
  <div class="printhead"><h2 style="margin:0">${esc(S.settings.name||"Society")} — Maintenance report</h2><p class="small muted" style="margin:2px 0 0">${esc(monthLabel(from))} to ${esc(monthLabel(to))} · generated ${esc(fmtDate(todayISO()))}</p></div>
  <div class="grid3 mt">
    <div class="card stat"><div class="n" style="font-size:18px">${inr(T.due)}</div><div class="l">Total due</div></div>
    <div class="card stat"><div class="n" style="font-size:18px;color:var(--pri)">${inr(T.paid)}</div><div class="l">Collected</div></div>
    <div class="card stat"><div class="n" style="font-size:18px;color:var(--red)">${inr(Math.max(T.due-T.paid,0))}</div><div class="l">Outstanding · ${defaulters} flats</div></div>
  </div>
  <div class="actions noprint"><button class="btn sec" data-a="csv">⬇ Download Excel (CSV)</button><button class="btn ghost" data-a="print">🖨 Print / PDF</button></div>
  <div class="card mt" style="padding:0;overflow-x:auto"><table class="rt"><thead><tr><th>Flat</th><th>Name</th><th>Months paid</th><th class="r">Due</th><th class="r">Paid</th><th class="r">Balance</th></tr></thead>
  <tbody>${R.map(x=>`<tr data-stmt="${esc(x.f.id)}"><td><b>${esc(x.f.number)}</b></td><td>${esc((x.f.occupancy==="Tenant"?x.f.tenant:x.f.owner)||x.f.owner||"")}</td><td>${x.mPaid}/${x.mDue}</td><td class="r">${inr(x.due)}</td><td class="r">${inr(x.paid)}</td><td class="r" style="color:${x.bal>0?"var(--red)":"var(--pri)"};font-weight:700">${inr(x.bal)}</td></tr>`).join("")}
  <tr class="tot"><td colspan="3">Total (${R.length} flats)</td><td class="r">${inr(T.due)}</td><td class="r">${inr(T.paid)}</td><td class="r">${inr(T.due-T.paid)}</td></tr></tbody></table></div>
  <p class="small muted noprint" style="margin:10px 4px">Tap a flat for its month-by-month statement. Due amounts use each flat's current monthly rate.</p>`;
}
function sheetStatement(id){
  const f=S.flats.find(x=>x.id===id);if(!f)return;

  <div class="card mt" style="padding:0;overflow-x:auto"><table class="rt"><thead><tr><th>Month</th><th class="r">Due</th><th class="r">Paid</th><th>Date / mode</th></tr></thead><tbody>
  ${x.rows.slice().reverse().map(r=>r.na?`<tr><td>${esc(monthLabel(r.m,true))}</td><td colspan="3" class="muted">Not applicable</td></tr>`:`<tr><td>${esc(monthLabel(r.m,true))}</td><td class="r">${inr(r.due)}</td><td class="r" style="color:${r.paid?"var(--pri)":"var(--red)"}">${r.paid?inr(r.paid):"Pending"}</td><td class="small">${r.r?esc(fmtDate(r.r.date)+" · "+(r.r.mode||"")+(r.r.ref?" · "+r.r.ref:"")):""}</td></tr>`).join("")}
  </tbody></table></div>`);
}
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadCSV(){
  const [from,to]=rptRange();const ms=monthsBetween(from,to);
  const head=["Flat","Owner","Tenant","Phone","Months due","Months paid","Amount due","Amount paid","Balance",...ms.map(m=>monthLabel(m,true))];
  const lines=[head];
  sortFlats(S.flats).forEach(f=>{const x=flatReport(f,ms);
    lines.push([f.number,f.owner,f.tenant,f.phone,x.mDue,x.mPaid,x.due,x.paid,x.bal,...x.rows.map(r=>r.na?"-":r.paid?("Paid "+r.paid):"Pending")])});
  const csv="﻿"+lines.map(l=>l.map(csvCell).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`maintenance-report-${from}-to-${to}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast("Report downloaded — open it in Excel or Google Sheets");
}

function dueStats(m){
  let total=0,coll=0,paidN=0,pendN=0;
  S.flats.filter(f=>applies(f,m)).forEach(f=>{const a=flatAmount(f);total+=a;const r=payRec(m,f.id);if(r&&r.paid){coll+=num(r.amount)||a;paidN++}else pendN++});
  return {total,coll,paidN,pendN};
}
function actBucket(a){
  const t=todayISO();
  if(a.status==="Completed"||a.status==="Cancelled")return"past";
  if(a.status==="Ongoing")return"ongoing";
  const end=a.endDate||a.date;
  if(a.date&&a.date<=t&&end>=t)return"ongoing";
  if(end&&end<t)return"past";
  return"upcoming";
}

const CAT_ICON={"Meeting":"🗣️","Event":"🎉","Festival":"🪔","Maintenance work":"🛠️","Notice":"📢","Other":"📌"};
function actCard(a){
  let d="",mo="";if(a.date){const [y,m,dd]=a.date.split("-").map(Number);d=dd;mo=new Date(y,m-1,dd).toLocaleDateString(LOC(),{month:"short"})}
  const b=actBucket(a);
  const badge=a.status==="Cancelled"?'<span class="badge b-red">Cancelled</span>':b==="ongoing"?'<span class="badge b-amber">Ongoing</span>':b==="past"?'<span class="badge b-grey">Done</span>':'<span class="badge b-blue">Upcoming</span>';
  return `<button class="act" data-act="${esc(a.id)}">

}
function vActs(){
  const groups={ongoing:[],upcoming:[],past:[]};
  S.acts.forEach(a=>groups[actBucket(a)].push(a));
  groups.ongoing.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  groups.upcoming.sort((a,b)=>String(a.date||"9").localeCompare(String(b.date||"9")));
  groups.past.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const L=groups[actSeg];
  if(evSeg==="meetings")return vMeetings();
  return evSegBar()+`<div class="seg">${["ongoing","upcoming","past"].map(k=>`<button class="${actSeg===k?"on":""}" data-seg="${k}">${{ongoing:"Ongoing",upcoming:"Upcoming",past:"Past"}[k]} · ${groups[k].length}</button>`).join("")}</div>
  <div class="list mt">${L.length?L.map(actCard).join(""):`<div class="empty"><b>Nothing ${actSeg==="past"?"in the past yet":actSeg==="ongoing"?"ongoing":"planned"}</b>${editable()&&actSeg!=="past"?"Tap + to add an event, notice or maintenance work.":""}</div>`}</div>`;
}

function bulkNumbers(fd){
  const wing=str(fd.get("wing"),6),from=Math.max(0,Math.floor(num(fd.get("from")))),to=Math.min(99,Math.floor(num(fd.get("to")))),per=Math.min(20,Math.max(1,Math.floor(num(fd.get("per")))));
  const out=[];for(let fl=from;fl<=to;fl++)for(let n=1;n<=per;n++)out.push((wing?wing+"-":"")+(fl===0?"G"+pad(n):fl+pad(n)));
  return out;
}
function bulkPreview(){const f=$("#fBulk");if(!f)return;const ns=bulkNumbers(new FormData(f));const ex=new Set(S.flats.map(x=>String(x.number).toLowerCase()));const nw=ns.filter(n=>!ex.has(n.toLowerCase()));
  $("#bulkPrev").textContent=ns.length?`${nw.length} new flats: ${ns.slice(0,3).join(", ")}${ns.length>3?" … "+ns[ns.length-1]:""}${nw.length<ns.length?` (${ns.length-nw.length} already exist, skipped)`:""}`:"Check the floor range."}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-go],[data-a],[data-ff],[data-df],[data-seg],[data-flat],[data-pay],[data-act],[data-occ],[data-ann],[data-cmp],[data-cseg],[data-rp],[data-stmt],[data-evseg],[data-mtg]");
  if(!t)return;
  if(t.dataset.occ){e.preventDefault();const f=$("#fFlat");f.occupancy.value=t.dataset.occ;document.querySelectorAll("#occSeg button").forEach(b=>b.classList.toggle("on",b===t));$("#tenantBox").hidden=t.dataset.occ!=="Tenant";return}
  if(t.dataset.tab){tab=t.dataset.tab;history.replaceState(null,"","#"+tab);if(tab==="dues")month=month||curMonth();render();scrollTo(0,0);return}
  if(t.dataset.go){tab=t.dataset.go;if(t.dataset.ff)flatFilter=t.dataset.ff;if(t.dataset.seg)actSeg=t.dataset.seg;if(tab==="dues")month=curMonth();history.replaceState(null,"","#"+tab);render();scrollTo(0,0);return}
  if(t.dataset.ff){flatFilter=t.dataset.ff;render();return}
  if(t.dataset.df){duesFilter=t.dataset.df;render();return}
  if(t.dataset.seg){actSeg=t.dataset.seg;render();return}
  if(t.dataset.pay){sheetPay(t.dataset.pay);return}
  if(t.dataset.stmt){sheetStatement(t.dataset.stmt);return}
  if(t.dataset.evseg){evSeg=t.dataset.evseg;render();return}
  if(t.dataset.mtg){curMtg=t.dataset.mtg;tab="minutes";history.replaceState(null,"","#minutes");render();scrollTo(0,0);return}
  if(t.dataset.ann){sheetAnn(t.dataset.ann);return}
  if(t.dataset.cmp){sheetCmp(t.dataset.cmp);return}
  if(t.dataset.cseg){cmpSeg=t.dataset.cseg;render();return}
  if(t.dataset.rp){rpt.period=t.dataset.rp;render();return}
  if(t.dataset.flat){sheetFlat(t.dataset.flat);return}
  if(t.dataset.act&&!t.dataset.a){sheetAct(t.dataset.act);return}
  const a=t.dataset.a,id=t.dataset.id;
  switch(a){
    case"close":closeSheet();break;
    case"signin":signIn();break;
    case"lang":setLang(LANG==="mr"?"en":"mr");break;
    case"mtgBack":tab="activities";evSeg="meetings";history.replaceState(null,"","#activities");render();break;
    case"editMtg":sheetMtgForm(id);break;
    case"delMtg":sheetConfirm("Delete this meeting and its minutes permanently?","Delete","delMtgYes",id);break;
    case"delMtgYes":closeSheet();deleteMtg(id);tab="activities";evSeg="meetings";render();toast("Meeting deleted");break;
    case"addDec":$("#decList").insertAdjacentHTML("beforeend",decRow());break;
    case"rmDec":{const r=t.closest(".dec-row");if(r)r.remove();break;}
    case"attMtg":sheetAttendance(id);break;
    case"attAll":case"attNone":{const box=$("#attBox");if(!box)break;box.querySelectorAll(".att-m,.att-f").forEach(c=>{const wrap=c.closest(".att-flat,.att-fl");if(!wrap||!wrap.hidden)c.checked=a==="attAll"});updateAttCount();break;}
    case"attSave":{const m=S.mtgs.find(x=>x.id===id);if(!m)break;const body={...m,...readAtt($("#attBox")),updatedAt:new Date().toISOString()};delete body.id;closeSheet();saveMtg(id,body);toast("Attendance saved");break;}
    case"copyMtg":{const m=S.mtgs.find(x=>x.id===id);if(m)copyText(mtgText(m));break;}
    case"joinEdit":openSheet(`<h3>My flat ${closeBtn()}</h3>${joinForm()}`);break;
    case"okMember":decideMember(id,"approved");break;
    case"rejMember":sheetConfirm("Reject this request? They can correct and send it again.","Reject","rejMemberYes",id);break;
    case"rejMemberYes":closeSheet();decideMember(id,"rejected");break;
    case"rmMember":sheetConfirm("Remove this person's access to the app?","Remove","rmMemberYes",id);break;
    case"rmMemberYes":closeSheet();removeMember(id);break;
    case"editAnn":sheetAnnForm(id);break;
    case"delAnn":sheetConfirm("Delete this announcement for everyone?","Delete","delAnnYes",id);break;
    case"delAnnYes":closeSheet();deleteAnn(id);toast("Announcement deleted");break;
    case"delCmp":sheetConfirm("Delete this complaint permanently?","Delete","delCmpYes",id);break;
    case"delCmpYes":closeSheet();deleteComplaint(id);toast("Complaint deleted");break;
    case"csv":downloadCSV();break;
    case"print":window.print();break;
    case"copyAnn":{const x=S.anns.find(y=>y.id===id);if(x)copyText(`${x.important?"🔴":"📢"} *${x.title}*\n\n${x.body}\n\n— ${S.settings.name||""} ${LANG==="mr"?"व्यवस्थापन समिती":"Managing Committee"}`);break;}
    case"signout":closeSheet();F.signOut(auth);break;
    case"claim":claimAdmin();break;
    case"rmAdmin":sheetConfirm("Remove "+id+" from the committee? They will only be able to view.","Remove","rmAdminYes",id);break;
    case"rmAdminYes":closeSheet();removeAdmin(id);break;
    case"settings":sheetSettings();break;
    case"bulk":sheetBulk();break;
    case"addAct":sheetActForm();break;
    case"editFlat":sheetFlatForm(id);break;
    case"editAct":sheetActForm(id);break;
    case"delFlat":sheetConfirm("This removes the flat and its details. Payment records stay in the monthly ledger.","Delete flat","delFlatYes",id);break;
    case"delFlatYes":closeSheet();await deleteFlat(id);toast("Flat deleted");break;
    case"delAct":sheetConfirm("Delete this activity?","Delete","delActYes",id);break;
    case"delActYes":closeSheet();await deleteAct(id);toast("Activity deleted");break;
    case"unpay":closeSheet();await setPayment(month,id,{paid:false});toast("Marked as unpaid");break;
    case"mPrev":month=shiftMonth(month,-1);render();break;
    case"mNext":month=shiftMonth(month,1);render();break;
    case"copyRem":{
      const pend=sortFlats(S.flats).filter(f=>applies(f,month)&&!isPaid(month,f.id));
      const txt=LANG==="mr"?`*${S.settings.name||"सोसायटी"} — मेंटेनन्स ${monthLabel(month)}*\nबाकी (देय तारीख ${S.settings.dueDay||10} ${monthLabel(month,true)}):\n`+pend.map(f=>`• ${f.number} — ${inr(flatAmount(f))}`).join("\n")+(S.settings.upi?`\n\nUPI: ${S.settings.upi}`:"")+`\nआधीच भरले असल्यास दुर्लक्ष करावे. धन्यवाद!`:`*${S.settings.name||"Society"} — Maintenance ${monthLabel(month)}*\nPending (due by ${S.settings.dueDay||10} ${monthLabel(month,true)}):\n`+pend.map(f=>`• ${f.number} — ${inr(flatAmount(f))}`).join("\n")+(S.settings.upi?`\n\nPay via UPI: ${S.settings.upi}`:"")+`\nPlease ignore if already paid. Thank you!`;
      copyText(txt);break;}
    case"copyAct":{const x=S.acts.find(y=>y.id===id);if(!x)break;
      const txt=`📢 *${x.title}*\n${x.category?x.category+"\n":""}🗓 ${fmtDate(x.date)}${x.endDate&&x.endDate!==x.date?" – "+fmtDate(x.endDate):""}${x.time?" · "+x.time:""}${x.venue?"\n📍 "+x.venue:""}${x.desc?"\n\n"+x.desc:""}\n\n— ${S.settings.name||(LANG==="mr"?"सोसायटी समिती":"Society Committee")}`;
      copyText(txt);break;}
  }
});
$("#scrim").addEventListener("click",closeSheet);
$("#fab").addEventListener("click",()=>{if(tab==="flats")sheetFlatForm();else if(tab==="notices")sheetAnnForm();else if(tab==="help")sheetCmpForm();else if(tab==="activities"&&evSeg==="meetings")sheetMtgForm();else sheetActForm()});
document.addEventListener("change",e=>{
  const s=e.target;
  if(s.dataset&&s.dataset.roleEmail){setAdmin(s.dataset.roleEmail,{role:s.value});toast("Role updated");}
  if(s.id==="cmpAnon"){$("#cmpWho").hidden=s.checked}
  if(s.classList&&(s.classList.contains("att-m")||s.classList.contains("att-f")))updateAttCount();
  if(s.id==="rpFrom"||s.id==="rpTo"){rpt.from=$("#rpFrom").value;rpt.to=$("#rpTo").value;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="flatQ"){flatQ=e.target.value;render._focusQ=true;render();render._focusQ=false}
  if(e.target.closest("#fBulk"))bulkPreview();
  if(e.target.id==="mtgQ"){mtgQ=e.target.value;render();const s=$("#mtgQ");if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}}
  if(e.target.classList&&e.target.classList.contains("att-q")){const q=e.target.value.toLowerCase().trim();const box=e.target.closest("#attBox");box.querySelectorAll(".att-flat,.att-fl").forEach(el=>{el.hidden=!!q&&!el.dataset.s.includes(q)});const d=box.querySelector("details");if(q&&d)d.open=true}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==tab){tab=h;render()}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f);
  if(f.id==="fJoin"){submitJoin(fd);return}
  if(f.id==="fMtg"){
    const id=f.dataset.id||"";const old=S.mtgs.find(m=>m.id===id)||{};
    const body={...readMtgForm(f),names:old.names||{},createdAt:old.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),by:old.by||myEmail()};
    const nid=saveMtg(id,body);closeSheet();curMtg=nid;tab="minutes";history.replaceState(null,"","#minutes");render();scrollTo(0,0);
    toast(id?"Meeting updated":"Meeting saved");return;
  }
  if(f.id==="fAdmin"){addAdmin(fd.get("email"),fd.get("name"),fd.get("role"));sheetSettings();return}
  if(f.id==="fAnn"){
    const id=f.dataset.id||"";const old=S.anns.find(a=>a.id===id)||{};
    const body={title:str(fd.get("title"),100),body:str(fd.get("body"),3000),important:!!fd.get("important"),createdAt:old.createdAt||new Date().toISOString(),byRole:old.byRole||myRole()||"",byEmail:old.byEmail||myEmail()};
    if(!id)lsSet("annSeen",body.createdAt);
    closeSheet();if(await saveAnn(id,body))toast(id?"Announcement updated":"Announcement posted");return;
  }
  if(f.id==="fCmp"){
    const anon=!!fd.get("anonymous");const now=new Date().toISOString();
    const body={title:str(fd.get("title"),100),details:str(fd.get("details"),2000),category:CMP_CATS[fd.get("category")]?fd.get("category"):"Other",anonymous:anon,status:"Open",createdAt:now,updatedAt:now};
    if(!anon){body.byEmail=myEmail();body.byName=str(fd.get("byName"),60);body.flat=str(fd.get("flat"),12)}
    closeSheet();if(addComplaint(body))toast(anon?"Complaint submitted anonymously":"Complaint submitted");return;
  }
  if(f.id==="fCmpUpd"){
    const st=Object.keys(CMP_ST).includes(fd.get("status"))?fd.get("status"):"Open";
    closeSheet();if(updateComplaint(f.dataset.id,{status:st,reply:str(fd.get("reply"),1500),updatedAt:new Date().toISOString(),repliedBy:myRole()||""}))toast("Complaint updated");return;
  }
  if(f.id==="fSettings"){
    const body={name:str(fd.get("name"),80),address:str(fd.get("address"),120),amount:num(fd.get("amount")),dueDay:Math.min(28,Math.max(1,Math.floor(num(fd.get("dueDay"))||10))),upi:str(fd.get("upi"),80)};
    closeSheet();if(await saveSettings(body))toast("Society details saved");
  }
  if(f.id==="fFlat"&&f.dataset.owner==="1"){
    const id=f.dataset.id;const occ=["Owner","Tenant","Vacant"].includes(fd.get("occupancy"))?fd.get("occupancy"):"Owner";
    const patch={occupancy:occ,owner:str(fd.get("owner"),60),phone:str(fd.get("phone"),16),tenant:occ==="Tenant"?str(fd.get("tenant"),60):"",tenantPhone:occ==="Tenant"?str(fd.get("tenantPhone"),16):"",
      leaseEnd:occ==="Tenant"?str(fd.get("leaseEnd"),10):"",email:str(fd.get("email"),80),members:num(fd.get("members"))||"",vehicle:str(fd.get("vehicle"),60),parking:str(fd.get("parking"),20),notes:str(fd.get("notes"),500)};
    closeSheet();if(await saveFlatOwner(id,patch))toast("Your details are updated");return;
  }
  if(f.id==="fFlat"){
    const id=f.dataset.id||"";const number=str(fd.get("number"),12);
    if(S.flats.some(x=>x.id!==id&&String(x.number).toLowerCase()===number.toLowerCase())){toast("Flat "+number+" already exists");return}
    const body={number,type:str(fd.get("type"),20),occupancy:["Owner","Tenant","Vacant"].includes(fd.get("occupancy"))?fd.get("occupancy"):"Owner",
      owner:str(fd.get("owner"),60),phone:str(fd.get("phone"),16),tenant:str(fd.get("tenant"),60),tenantPhone:str(fd.get("tenantPhone"),16),leaseEnd:str(fd.get("leaseEnd"),10),
      email:str(fd.get("email"),80),members:num(fd.get("members"))||"",area:num(fd.get("area"))||"",vehicle:str(fd.get("vehicle"),60),parking:str(fd.get("parking"),20),
      amount:num(fd.get("amount"))||"",since:/^\d{4}-\d{2}$/.test(fd.get("since")||"")?fd.get("since"):"",notes:str(fd.get("notes"),500)};
    if(body.occupancy!=="Tenant"){body.tenant="";body.tenantPhone="";body.leaseEnd=""}
    closeSheet();if(await saveFlat(id,body))toast(id?"Flat updated":"Flat added");
  }
  if(f.id==="fBulk"){
    const ex=new Set(S.flats.map(x=>String(x.number).toLowerCase()));
    const ns=bulkNumbers(fd).filter(n=>!ex.has(n.toLowerCase()));
    if(!ns.length){toast("Nothing new to add");return}
    if(ns.length>400){toast("That's too many at once — add one wing at a time");return}
    const type=str(fd.get("type"),20),amount=num(fd.get("amount"))||"";
    closeSheet();toast("Adding "+ns.length+" flats…");
    let ok=0;for(const n of ns){if(await saveFlat(null,{number:n,type,occupancy:"Owner",amount,owner:"",phone:"",since:curMonth()}))ok++;else break}
    toast(ok+" flats added");tab="flats";history.replaceState(null,"","#flats");render();
  }
  if(f.id==="fPay"){
    const rec={paid:true,amount:num(fd.get("amount")),date:str(fd.get("date"),10),mode:str(fd.get("mode"),20),ref:str(fd.get("ref"),40)};
    closeSheet();if(await setPayment(month,f.dataset.id,rec))toast("Payment recorded");
  }
  if(f.id==="fAct"){
    const id=f.dataset.id||"";
    const body={title:str(fd.get("title"),80),category:str(fd.get("category"),30),status:str(fd.get("status"),20),date:str(fd.get("date"),10),endDate:str(fd.get("endDate"),10),
      time:str(fd.get("time"),30),venue:str(fd.get("venue"),60),owner:str(fd.get("owner"),60),cost:num(fd.get("cost"))||"",desc:str(fd.get("desc"),1500)};
    if(body.endDate&&body.date&&body.endDate<body.date)body.endDate=body.date;
    closeSheet();if(await saveAct(id,body))toast(id?"Activity updated":"Activity added");
  }
});

document.documentElement.lang=LANG;document.title=tr("Society Manager");
render();if(LANG==="mr")trTree(document.body);
connect();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
